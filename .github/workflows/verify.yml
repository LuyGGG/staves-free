name: Verify Staves
on: [push, pull_request]
permissions:
  contents: read
jobs:
  midi-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test Tests/engine.test.js
  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile for iOS Simulator
        run: xcodebuild -project Staves.xcodeproj -scheme Staves -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
  score-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-preview-and-pdf
          path: Tests/artifacts/
          if-no-files-found: ignore
