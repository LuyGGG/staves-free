<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"><title>Staves score</title><style>
:root{color-scheme:light;font:15px -apple-system,BlinkMacSystemFont,sans-serif;color:#203532;background:#f5f5ef}*{box-sizing:border-box}body{margin:0}header{padding:22px 22px 16px;border-bottom:1px solid #dce1d8;background:#f5f5ef;position:sticky;top:0;z-index:2}label{font-size:13px;color:#52635f}select{font:inherit;border:1px solid #b9c9bf;padding:8px;border-radius:8px;background:white;color:#203532;margin-left:8px}#parts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}#parts label{display:flex;align-items:center;gap:5px;border:1px solid #cbd6ce;border-radius:18px;padding:7px 10px;background:white}input{accent-color:#28745d}#summary{font-size:12px;margin-top:12px;color:#52635f}#warnings{background:#fff4d7;color:#795b18;padding:12px 18px;font-size:13px;line-height:1.5}#warnings:empty{display:none}#error{color:#a12b2b;padding:16px}#error:empty{display:none}#paper{background:white;margin:20px;padding:24px 12px;min-height:500px;box-shadow:0 2px 16px #23372d0b;overflow:auto;border-radius:4px}#score{min-width:640px}#placeholder{text-align:center;padding:100px 20px;color:#678074}#placeholder h1{font:32px Georgia,serif;color:#203532}#hint{font-size:12px;color:#61766d;margin:0 22px 20px}@media print{body{background:white}header,#warnings,#hint,#error{display:none}#paper{margin:0;padding:0;box-shadow:none}#score{min-width:0}svg{break-inside:avoid;page-break-inside:avoid}}
</style></head><body><header hidden id="controls"><label>Rhythm grid <select id="grid" aria-label="Quantization"><option value="8">Eighth notes</option><option value="16" selected>Sixteenth notes</option><option value="32">Thirty-second notes</option></select></label><div id="parts"></div><div id="summary"></div></header><div id="warnings" role="status"></div><div id="error" role="alert"></div><main id="paper"><div id="placeholder"><h1>Your music, on paper.</h1><p>Import a MIDI file to see its score.</p></div><div id="score"></div></main><p id="hint" hidden>Scroll sideways on smaller screens. Export PDF for a full-width, printable score.</p><script src="abcjs-basic-min.js"></script><script src="engine.js"></script><script>
let midi,score,title='Untitled',currentRequest;
const el=id=>document.getElementById(id);
function notify(payload){window.webkit?.messageHandlers?.staves?.postMessage(payload);}
function render(){try{el('error').textContent='';const parts=[...document.querySelectorAll('#parts input:checked')].map(x=>x.value);score=Staves.buildScore(midi,{grid:Number(el('grid').value),parts});
 const abc=Staves.toABC(score,title);ABCJS.renderAbc('score',abc,{responsive:'resize',staffwidth:900,paddingtop:24,paddingbottom:24,add_classes:true});
 el('summary').textContent=`${score.voices.length} staves · ${score.measures} measures · ${midi.meter.numerator}/${midi.meter.denominator} · ♩ ${midi.tempo}`;
 el('warnings').textContent=score.warnings.join(' ');notify({type:'converted',request:currentRequest,xml:Staves.toMusicXML(score,title)});
 }catch(e){score=null;el('score').replaceChildren();el('error').textContent=e.message;notify({type:'error',request:currentRequest,message:e.message});}}
window.loadMIDI=(base64,name,request)=>{currentRequest=request;title=name;score=null;try{const raw=atob(base64),bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));midi=Staves.parseMIDI(bytes);el('placeholder').hidden=true;el('controls').hidden=false;el('hint').hidden=false;el('parts').replaceChildren();for(const p of midi.parts){const l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=true;c.value=p.id;c.addEventListener('change',render);l.append(c,document.createTextNode(p.name));el('parts').append(l);}render();}catch(e){el('score').replaceChildren();el('error').textContent=e.message;notify({type:'error',request:currentRequest,message:e.message});}};
el('grid').addEventListener('change',render);notify({type:'ready'});
</script></body></html>
